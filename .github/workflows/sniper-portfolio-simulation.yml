name: Sniper Portfolio Capacity Simulation

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Prima data dei segnali (YYYY-MM-DD)"
        required: false
        default: "2023-01-01"
  push:
    paths:
      - 'sniper_portfolio_simulation.py'
      - '.github/workflows/sniper-portfolio-simulation.yml'
      - 'data/instrument_universe.json'

permissions:
  contents: write
concurrency:
  group: sniper-portfolio-simulation
  cancel-in-progress: false
jobs:
  portfolio-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'yfinance[repair]' pandas numpy
      - name: Run portfolio simulation
        run: python sniper_portfolio_simulation.py --from-date "\${{ github.event.inputs.from_date || '2023-01-01' }}"
      - name: Commit results
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git add data/sniper_portfolio_*
          git diff --staged --quiet || git commit -m "Sniper: publish portfolio capacity simulation"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sniper-portfolio-capacity-simulation
          path: data/sniper_portfolio_*
