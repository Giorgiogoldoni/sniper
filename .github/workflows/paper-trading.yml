name: Sniper Paper Trading

on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_trading.py'
      - 'walking_entry_test.py'
      - '.github/workflows/paper-trading.yml'
      - 'data/instrument_universe.json'
  schedule:
    # After US close; UTC. The script processes only completed Yahoo daily bars.
    - cron: '45 23 * * 1-5'

permissions:
  contents: write

# Serialize every paper run so the live ledger and historical backfill cannot race.
concurrency:
  group: sniper-paper-trading-main
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'yfinance[repair]' pandas numpy
      - name: Run paper engine self-tests
        run: python paper_trading.py --self-test
      - name: Update paper book
        run: python paper_trading.py
      - name: Reconstruct historical paper from 1 October 2026 (isolated book)
        run: python paper_trading.py --backfill-from 2026-10-01
      - name: Compare commodity Walking entry filters (isolated test)
        run: python walking_entry_test.py --from-date 2026-10-01
      - name: Commit paper ledger
        run: |
          git config user.name "raptor-bot"
          git config user.email "raptor-bot@users.noreply.github.com"
          git add data/paper_trading_state.json data/paper_trading_log.csv data/paper_trading_summary.json data/paper_backfill_20261001_state.json data/paper_backfill_20261001_log.csv data/paper_backfill_20261001_summary.json data/walking_entry_test_20261001.json data/walking_entry_test_20261001_trades.csv
          git diff --staged --quiet || git commit -m "sniper: update paper trading ledger"
          # Rebase on concurrent repository updates (e.g. Pages deployments) before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after rebase."
            sleep 3
          done
          echo "Unable to publish paper ledger after 3 attempts."
          exit 1
      - name: Upload paper report
        uses: actions/upload-artifact@v4
        with:
          name: sniper-paper-trading
          path: |
            data/paper_trading_state.json
            data/paper_trading_log.csv
            data/paper_trading_summary.json
            data/walking_entry_test_20261001.json
            data/walking_entry_test_20261001_trades.csv
