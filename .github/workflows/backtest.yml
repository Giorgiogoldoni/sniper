name: Sniper Indicator Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_indicators.py'
      - 'backtest_stops.py'
      - '.github/workflows/backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Run historical indicator backtest
        run: python backtest_indicators.py
      - name: Run next-open ATR and Chandelier backtest
        run: python backtest_stops.py
      - name: Commit results
        run: |
          git config user.name "raptor-bot"
          git config user.email "raptor-bot@users.noreply.github.com"
          git add data/backtest_results.json data/backtest_detail.csv data/backtest_stops_results.json data/backtest_stops_detail.csv data/backtest_exclusion_audit.json
          git diff --staged --quiet || git commit -m "sniper: publish indicator and stop backtest results"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sniper-indicator-and-stop-backtest
          path: |
            data/backtest_results.json
            data/backtest_detail.csv
            data/backtest_stops_results.json
            data/backtest_stops_detail.csv
            data/backtest_exclusion_audit.json
