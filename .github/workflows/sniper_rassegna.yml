name: RAPTOR Sniper — Rassegna Mattutina

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      fresh_hours:
        description: 'Finestra ore (default 48)'
        required: false
        default: '48'

jobs:
  rassegna-mattutina:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scarica script e dati aggiornati
        run: |
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/sniper_email.py -o sniper_email.py
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/signals.json -o signals.json
          mkdir -p data
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/data/paper_trading_state.json -o data/paper_trading_state.json
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/data/paper_trading_summary.json -o data/paper_trading_summary.json
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/data/short_paper_state.json -o data/short_paper_state.json
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/data/short_paper_summary.json -o data/short_paper_summary.json
          curl -fsSL https://raw.githubusercontent.com/Giorgiogoldoni/sniper/main/data/instrument_universe.json -o data/instrument_universe.json

      - name: Invia bollettino operativo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          FRESH_HOURS: ${{ github.event.inputs.fresh_hours || '48' }}
        run: python sniper_email.py
