name: Sniper Update

on:
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:

jobs:
  sniper:
    name: Sniper Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance numpy --break-system-packages -q
      - name: Run Sniper
        run: python sniper.py
      - name: Run independent SHORT PAPER engine
        run: python paper_trading_short.py
      - name: Commit & push
        run: |
          git config user.name  "raptor-bot"
          git config user.email "raptor-bot@users.noreply.github.com"
          git add signals.json signals_latest.json data/short_paper_state.json data/short_paper_log.csv data/short_paper_summary.json
          git diff --staged --quiet || git commit -m "sniper: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
      - name: Send end-of-day operational email
        if: (github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5') || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          FRESH_HOURS: '48'
        run: python sniper_email.py
